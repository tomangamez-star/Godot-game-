name: Build Character Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3-stable
  GODOT_TEMPLATE_VERSION: 4.3.stable
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_COMMAND_LINE_TOOLS: 11076708

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          COMMAND_LINE_TOOLS_DIR="$ANDROID_SDK_ROOT/cmdline-tools/latest"
          COMMAND_LINE_TOOLS_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"

          mkdir -p "$COMMAND_LINE_TOOLS_DIR"
          curl --fail --location --retry 3 --output "$COMMAND_LINE_TOOLS_ZIP" \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_LINE_TOOLS}_latest.zip"
          unzip -q "$COMMAND_LINE_TOOLS_ZIP" -d "$RUNNER_TEMP/android-command-line-tools"
          mv "$RUNNER_TEMP/android-command-line-tools/cmdline-tools"/* "$COMMAND_LINE_TOOLS_DIR/"

          SDKMANAGER="$COMMAND_LINE_TOOLS_DIR/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          echo "$COMMAND_LINE_TOOLS_DIR/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          test -f "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          TEMPLATES_TPZ="$RUNNER_TEMP/godot-export-templates.tpz"
          GODOT_RELEASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"

          curl --fail --location --retry 3 --output "$GODOT_ZIP" \
            "$GODOT_RELEASE_URL/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          install -m 755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 --output "$TEMPLATES_TPZ" \
            "$GODOT_RELEASE_URL/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$TEMPLATES_TPZ" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"

          CONFIG_DIR="$HOME/.config/godot"
          KEYSTORE="$CONFIG_DIR/debug.keystore"
          mkdir -p "$CONFIG_DIR"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/debug_keystore = "%s"\n' "$KEYSTORE"
          } > "$CONFIG_DIR/editor_settings-4.tres"

          "$RUNNER_TEMP/godot/godot" --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Import and export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --editor --path . --import --quit
          godot --headless --path . --export-debug Android build/Character-Test-v0.0.9.apk
          test -s build/Character-Test-v0.0.9.apk
          unzip -tq build/Character-Test-v0.0.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Character-Test-v0.0.9-APK
          path: build/Character-Test-v0.0.9.apk
          if-no-files-found: error
          retention-days: 14
